<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>最小样本量计算器</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0a0e14;
            --bg-secondary: #141a22;
            --bg-tertiary: #1c242e;
            --bg-card: #151c25;
            --border-color: #2a3441;
            --text-primary: #e8eaed;
            --text-secondary: #9ca3af;
            --text-muted: #6b7280;
            --accent-blue: #3b82f6;
            --accent-cyan: #06b6d4;
            --accent-green: #10b981;
            --accent-orange: #f59e0b;
            --accent-purple: #8b5cf6;
            --accent-red: #ef4444;
            --shadow: 0 4px 32px rgba(0,0,0,0.5);
            --glow-blue: 0 0 20px rgba(59, 130, 246, 0.3);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary); color: var(--text-primary);
            min-height: 100vh; line-height: 1.7;
            background-image: radial-gradient(ellipse at 10% 20%, rgba(59,130,246,0.08) 0%, transparent 50%),
                              radial-gradient(ellipse at 90% 80%, rgba(139,92,246,0.06) 0%, transparent 50%);
        }
        .container { max-width: 1200px; margin: 0 auto; padding: 48px 24px; }
        
        /* Scenario Switch */
        .scenario-switch {
            position: fixed; top: 20px; left: 20px; z-index: 1000;
            display: flex; background: var(--bg-secondary); border-radius: 12px;
            padding: 4px; border: 1px solid var(--border-color); box-shadow: var(--shadow);
        }
        .scenario-btn {
            padding: 10px 18px; border: none; background: transparent;
            color: var(--text-secondary); font-size: 0.85rem; font-family: inherit;
            cursor: pointer; border-radius: 8px; transition: all 0.25s;
            display: flex; align-items: center; gap: 8px; font-weight: 500;
        }
        .scenario-btn.active { background: linear-gradient(135deg, var(--accent-green), var(--accent-cyan)); color: white; }
        .scenario-btn.active.ab-test { background: linear-gradient(135deg, var(--accent-orange), var(--accent-red)); }
        .scenario-btn:hover:not(.active) { background: var(--bg-tertiary); color: var(--text-primary); }
        
        header { text-align: center; margin-bottom: 48px; padding-top: 20px; }
        h1 {
            font-size: 2.25rem; font-weight: 700; margin-bottom: 12px;
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-blue), var(--accent-purple));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .subtitle { color: var(--text-secondary); font-size: 1rem; }
        .scenario-badge {
            display: inline-flex; align-items: center; gap: 6px; padding: 6px 14px;
            border-radius: 20px; font-size: 0.8rem; font-weight: 500; margin-top: 12px;
        }
        .scenario-badge.monitoring { background: rgba(16,185,129,0.15); color: var(--accent-green); border: 1px solid rgba(16,185,129,0.3); }
        .scenario-badge.ab-test { background: rgba(245,158,11,0.15); color: var(--accent-orange); border: 1px solid rgba(245,158,11,0.3); }
        
        /* Mode Switch */
        .mode-switch { display: flex; justify-content: center; margin-bottom: 36px; }
        .switch-container { display: inline-flex; background: var(--bg-secondary); border-radius: 14px; padding: 5px; border: 1px solid var(--border-color); }
        .switch-btn {
            padding: 14px 28px; border: none; background: transparent; color: var(--text-secondary);
            font-size: 0.9rem; font-family: inherit; cursor: pointer; border-radius: 10px;
            transition: all 0.25s; display: flex; align-items: center; gap: 10px; font-weight: 500;
        }
        .switch-btn.active { background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple)); color: white; }
        .switch-btn:hover:not(.active) { background: var(--bg-tertiary); }
        
        /* Card */
        .card {
            background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 20px;
            padding: 32px; margin-bottom: 24px; position: relative; overflow: visible;
        }
        .card::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px;
            background: linear-gradient(90deg, transparent, rgba(59,130,246,0.5), transparent);
        }
        .card-header { display: flex; align-items: center; gap: 14px; margin-bottom: 28px; padding-bottom: 20px; border-bottom: 1px solid var(--border-color); }
        .card-icon { width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 1.3rem; }
        .card-icon.blue { background: linear-gradient(135deg, rgba(59,130,246,0.2), rgba(6,182,212,0.2)); }
        .card-icon.green { background: linear-gradient(135deg, rgba(16,185,129,0.2), rgba(6,182,212,0.2)); }
        .card-icon.purple { background: linear-gradient(135deg, rgba(139,92,246,0.2), rgba(236,72,153,0.2)); }
        .card-title { font-size: 1.15rem; font-weight: 600; }
        .card-desc { font-size: 0.8rem; color: var(--text-secondary); margin-top: 3px; }
        
        /* Form */
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 20px; }
        .form-group { display: flex; flex-direction: column; gap: 8px; position: relative; }
        label { font-size: 0.85rem; color: var(--text-secondary); font-weight: 500; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
        
        /* Tooltip - 智能定位 */
        .tooltip { position: relative; cursor: help; color: var(--accent-cyan); display: inline-flex; }
        .tooltip::after {
            content: attr(data-tip); position: absolute;
            bottom: calc(100% + 8px); left: 50%; transform: translateX(-50%);
            background: var(--bg-primary); color: var(--text-primary);
            padding: 12px 16px; border-radius: 10px; font-size: 0.75rem; font-weight: 400;
            opacity: 0; visibility: hidden; transition: all 0.15s; z-index: 99999;
            border: 1px solid var(--border-color); width: 240px;
            white-space: normal; text-align: left; line-height: 1.6; 
            box-shadow: 0 8px 32px rgba(0,0,0,0.6);
            pointer-events: none;
        }
        .tooltip:hover::after { opacity: 1; visibility: visible; }
        /* 靠右的tooltip向左展开 */
        .tooltip.tip-left::after { left: auto; right: -8px; transform: none; }
        /* 靠左的tooltip向右展开 */
        .tooltip.tip-right::after { left: -8px; right: auto; transform: none; }
        
        input[type="number"] {
            background: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: 10px;
            padding: 12px 16px; color: var(--text-primary); font-size: 0.95rem;
            font-family: 'JetBrains Mono', monospace; width: 100%;
        }
        input:focus { outline: none; border-color: var(--accent-blue); box-shadow: 0 0 0 3px rgba(59,130,246,0.15); }
        input::placeholder { color: var(--text-muted); }
        .input-suffix { position: relative; }
        .input-suffix input { padding-right: 44px; }
        .input-suffix::after {
            content: attr(data-suffix); position: absolute; right: 16px; top: 50%;
            transform: translateY(-50%); color: var(--text-muted); font-size: 0.85rem;
        }
        
        /* Checkbox */
        .checkbox-row { display: flex; align-items: center; gap: 10px; margin: 16px 0 8px; padding: 12px 16px; background: var(--bg-secondary); border-radius: 10px; }
        .checkbox-row input[type="checkbox"] { width: 18px; height: 18px; cursor: pointer; accent-color: var(--accent-cyan); }
        .checkbox-row label { margin: 0; cursor: pointer; font-size: 0.85rem; color: var(--text-secondary); }
        
        /* Two Column for AB */
        .two-column { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; }
        .column-box { background: var(--bg-secondary); border-radius: 14px; padding: 20px; border: 1px solid var(--border-color); }
        .column-header { font-size: 0.9rem; font-weight: 600; margin-bottom: 16px; padding: 8px 12px; border-radius: 8px; text-align: center; }
        .column-header.control { background: rgba(59,130,246,0.15); color: var(--accent-blue); }
        .column-header.treatment { background: rgba(245,158,11,0.15); color: var(--accent-orange); }
        
        /* Preset & Page */
        .preset-section { margin-bottom: 24px; }
        .preset-label { font-size: 0.8rem; color: var(--text-muted); margin-bottom: 10px; display: block; }
        .preset-buttons { display: flex; gap: 10px; flex-wrap: wrap; }
        .preset-btn {
            padding: 10px 20px; background: var(--bg-secondary); border: 1px solid var(--border-color);
            border-radius: 8px; color: var(--text-secondary); font-size: 0.85rem; font-family: inherit; cursor: pointer;
        }
        .preset-btn:hover { border-color: var(--accent-cyan); color: var(--accent-cyan); }
        .preset-btn.active { background: rgba(6,182,212,0.15); border-color: var(--accent-cyan); color: var(--accent-cyan); }
        
        .page-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; margin-bottom: 24px; }
        .page-checkbox { display: none; }
        .page-label {
            display: flex; flex-direction: column; align-items: center; padding: 16px 12px;
            background: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: 12px;
            cursor: pointer; font-size: 0.9rem; font-weight: 500; transition: all 0.2s;
        }
        .page-label .page-full-name { font-size: 0.7rem; color: var(--text-muted); margin-top: 4px; }
        .page-checkbox:checked + .page-label { background: rgba(59,130,246,0.15); border-color: var(--accent-blue); color: var(--accent-blue); }
        
        .page-configs { display: flex; flex-direction: column; gap: 16px; }
        .page-config { background: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: 14px; padding: 20px 24px; display: none; }
        .page-config.active { display: block; }
        .page-config-header { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
        .page-badge { font-size: 0.8rem; padding: 5px 12px; border-radius: 6px; font-weight: 600; }
        .page-badge.L { background: rgba(59,130,246,0.2); color: #60a5fa; }
        .page-badge.D { background: rgba(16,185,129,0.2); color: #34d399; }
        .page-badge.B { background: rgba(245,158,11,0.2); color: #fbbf24; }
        .page-badge.O { background: rgba(139,92,246,0.2); color: #a78bfa; }
        .page-badge.M { background: rgba(236,72,153,0.2); color: #f472b6; }
        
        /* Buttons */
        .btn {
            padding: 14px 32px; border: none; border-radius: 12px; font-size: 0.95rem;
            font-family: inherit; font-weight: 600; cursor: pointer; transition: all 0.25s;
            display: inline-flex; align-items: center; justify-content: center; gap: 10px;
        }
        .btn-primary { background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple)); color: white; }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: var(--glow-blue); }
        .btn-secondary { background: var(--bg-tertiary); color: var(--text-secondary); border: 1px solid var(--border-color); }
        .action-row { display: flex; gap: 14px; margin-top: 28px; justify-content: flex-end; }
        
        /* Results */
        .results-section { display: none; }
        .results-section.visible { display: block; animation: fadeIn 0.4s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        
        .result-summary {
            background: linear-gradient(135deg, rgba(59,130,246,0.12), rgba(139,92,246,0.12));
            border: 1px solid rgba(59,130,246,0.3); border-radius: 20px; padding: 36px;
            margin-bottom: 28px; text-align: center; position: relative;
        }
        .result-summary::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
            background: linear-gradient(90deg, var(--accent-cyan), var(--accent-blue), var(--accent-purple));
        }
        .result-label { font-size: 0.9rem; color: var(--text-secondary); margin-bottom: 10px; }
        .result-value {
            font-size: 3rem; font-weight: 700; font-family: 'JetBrains Mono', monospace;
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-blue));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .result-unit { font-size: 1.2rem; -webkit-text-fill-color: var(--text-secondary); }
        .result-note { font-size: 0.8rem; color: var(--text-muted); margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--border-color); }
        
        .ab-result-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 28px; }
        .ab-result-card { background: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: 14px; padding: 20px; text-align: center; }
        .ab-result-card.highlight { border-color: var(--accent-cyan); background: rgba(6,182,212,0.1); }
        .ab-result-label { font-size: 0.75rem; color: var(--text-muted); margin-bottom: 8px; }
        .ab-result-value { font-size: 1.8rem; font-weight: 700; font-family: 'JetBrains Mono', monospace; }
        .ab-result-card.highlight .ab-result-value { color: var(--accent-cyan); }
        
        .ci-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-top: 24px; }
        .ci-card { background: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: 14px; padding: 20px; text-align: center; }
        .ci-level { font-size: 0.75rem; color: var(--text-muted); margin-bottom: 6px; }
        .ci-value { font-size: 1.5rem; font-weight: 700; font-family: 'JetBrains Mono', monospace; }
        .ci-card.primary { border-color: var(--accent-blue); background: rgba(59,130,246,0.1); }
        .ci-card.primary .ci-value { color: var(--accent-blue); }
        
        .table-container { overflow-x: auto; margin-top: 20px; }
        .results-table { width: 100%; border-collapse: collapse; }
        .results-table th, .results-table td { padding: 14px 16px; text-align: left; border-bottom: 1px solid var(--border-color); }
        .results-table th { background: var(--bg-secondary); font-size: 0.75rem; color: var(--text-secondary); text-transform: uppercase; }
        .results-table td { font-family: 'JetBrains Mono', monospace; font-size: 0.9rem; }
        .highlight-cell { color: var(--accent-cyan); font-weight: 600; }
        .warning-cell { color: var(--accent-orange); }
        .success-cell { color: var(--accent-green); }
        
        .info-box { background: rgba(6,182,212,0.08); border: 1px solid rgba(6,182,212,0.2); border-radius: 12px; padding: 18px; margin-top: 20px; font-size: 0.82rem; color: var(--text-secondary); line-height: 1.7; }
        .info-box strong { color: var(--accent-cyan); }
        .info-box.ab-test { background: rgba(245,158,11,0.08); border-color: rgba(245,158,11,0.2); }
        .info-box.ab-test strong { color: var(--accent-orange); }
        
        .formula-display { background: var(--bg-tertiary); border-radius: 12px; padding: 20px; margin-top: 24px; font-family: 'JetBrains Mono', monospace; font-size: 0.8rem; color: var(--text-secondary); line-height: 1.8; border: 1px solid var(--border-color); }
        .formula-display strong { color: var(--accent-purple); }
        
        .section-title { font-size: 1rem; font-weight: 600; margin: 28px 0 18px; display: flex; align-items: center; gap: 10px; }
        .section-title::before { content: ''; width: 4px; height: 20px; background: linear-gradient(180deg, var(--accent-blue), var(--accent-purple)); border-radius: 2px; }
        
        @media (max-width: 768px) {
            .container { padding: 24px 16px; padding-top: 80px; }
            .scenario-switch { top: 10px; left: 10px; right: 10px; justify-content: center; }
            .form-grid, .two-column { grid-template-columns: 1fr; }
            .page-grid { grid-template-columns: repeat(3, 1fr); }
            .ab-result-grid, .ci-grid { grid-template-columns: 1fr; }
            .result-value { font-size: 2.2rem; }
        }
        
        /* Watermark */
        .watermark {
            position: fixed; bottom: 16px; right: 20px; 
            font-size: 0.7rem; color: var(--text-muted); opacity: 0.5;
            font-family: 'Noto Sans SC', sans-serif; letter-spacing: 0.02em;
            pointer-events: none; z-index: 100;
        }
    </style>
</head>
<body>
    <div class="watermark">URS数据科学团队 © 2026</div>
    
    <div class="scenario-switch">
        <button class="scenario-btn active" data-scenario="monitoring" onclick="switchScenario('monitoring')">📈 长期观测</button>
        <button class="scenario-btn" data-scenario="ab-test" onclick="switchScenario('ab-test')">🧪 AB 测试</button>
    </div>

    <div class="container">
        <header>
            <h1><span id="page-title">长期观测</span>最小样本量计算器</h1>
            <p class="subtitle">基于二项分布的加权页面样本量估算工具</p>
            <div class="scenario-badge monitoring" id="scenario-badge">📈 配对样本</div>
        </header>

        <div class="mode-switch">
            <div class="switch-container">
                <button class="switch-btn active" data-mode="mode1" onclick="switchMode('mode1')">🎯 精度 → 样本量</button>
                <button class="switch-btn" data-mode="mode2" onclick="switchMode('mode2')">📐 样本量 → 精度</button>
            </div>
        </div>

        <!-- ==================== Mode 1: 精度 → 样本量 ==================== -->
        <div id="mode1">
            <div class="card">
                <div class="card-header">
                    <div class="card-icon blue">🌐</div>
                    <div><div class="card-title">总体参数设置</div><div class="card-desc">设定观测目标和精度要求</div></div>
                </div>
                
                <!-- 长期观测：单组输入 -->
                <div id="m1-monitoring">
                    <div class="form-grid">
                        <div class="form-group">
                            <label>总体观测目标 p <span class="tooltip tip-right" data-tip="预期的比例值，如满意率、转化率等。填写0-100之间的百分比。">ⓘ</span></label>
                            <div class="input-suffix" data-suffix="%"><input type="number" id="m1-p" placeholder="例如: 70" step="0.1" min="0" max="100"></div>
                        </div>
                        <div class="form-group">
                            <label>总体波动精度 δ (MDE) <span class="tooltip" data-tip="希望检测到的最小波动。如想检测1%的波动（70%→71%），填1。">ⓘ</span></label>
                            <div class="input-suffix" data-suffix="%"><input type="number" id="m1-delta" placeholder="例如: 1" step="0.1" min="0"></div>
                        </div>
                        <div class="form-group">
                            <label>显著性水平 α <span class="tooltip" data-tip="假阳性率。α=0.2表示20%概率误报。常用0.05-0.2。">ⓘ</span></label>
                            <input type="number" id="m1-alpha" value="0.2" step="0.01" min="0.01" max="0.2">
                        </div>
                        <div class="form-group">
                            <label>统计功效 (1-β) <span class="tooltip tip-left" data-tip="检测到真实效应的概率。0.8表示80%概率检测到。常用0.6-0.8。">ⓘ</span></label>
                            <input type="number" id="m1-power" value="0.6" step="0.01" min="0.5" max="0.99">
                        </div>
                    </div>
                </div>
                
                <!-- AB测试：两组分别输入 -->
                <div id="m1-ab" style="display:none;">
                    <div class="form-grid">
                        <div class="form-group">
                            <label>总体波动精度 δ (MDE) <span class="tooltip tip-right" data-tip="最小可检测效应：希望检测到的B组相对于A组的最小差异。例如A组为70%，想检测到71%或69%的变化，填1。">ⓘ</span></label>
                            <div class="input-suffix" data-suffix="%"><input type="number" id="m1-ab-delta" placeholder="例如: 1" step="0.1" min="0"></div>
                        </div>
                        <div class="form-group">
                            <label>显著性水平 α <span class="tooltip" data-tip="假阳性率。α=0.2表示20%概率误报。">ⓘ</span></label>
                            <input type="number" id="m1-ab-alpha" value="0.2" step="0.01" min="0.01" max="0.2">
                        </div>
                        <div class="form-group">
                            <label>统计功效 (1-β) <span class="tooltip tip-left" data-tip="检测到真实效应的概率。0.6表示60%概率检测到。">ⓘ</span></label>
                            <input type="number" id="m1-ab-power" value="0.6" step="0.01" min="0.5" max="0.99">
                        </div>
                    </div>
                    <div class="two-column">
                        <div class="column-box">
                            <div class="column-header control">A 组（对照组 / 基准组）</div>
                            <div class="form-grid">
                                <div class="form-group">
                                    <label>预期比例 p <span class="tooltip tip-right" data-tip="A组（对照组）的预期比例值，作为比较基准。">ⓘ</span></label>
                                    <div class="input-suffix" data-suffix="%"><input type="number" id="m1-ab-p1" placeholder="例如: 70" step="0.1"></div>
                                </div>
                            </div>
                        </div>
                        <div class="column-box">
                            <div class="column-header treatment">B 组（实验组）</div>
                            <div class="form-grid">
                                <div class="form-group">
                                    <label>预期比例 p <span class="tooltip tip-left" data-tip="B组（实验组）的预期比例值。通常与A组相近，除非预期有明显效应。">ⓘ</span></label>
                                    <div class="input-suffix" data-suffix="%"><input type="number" id="m1-ab-p2" placeholder="例如: 70" step="0.1"></div>
                                </div>
                            </div>
                            <div class="checkbox-row">
                                <input type="checkbox" id="m1-sync-p" checked>
                                <label for="m1-sync-p">AB组预期比例 p 一致</label>
                            </div>
                        </div>
                    </div>
                </div>
                
                <div class="info-box" id="m1-info"></div>
            </div>

            <!-- 页面配置 -->
            <div class="card">
                <div class="card-header">
                    <div class="card-icon green">📄</div>

<script>
/******************************************************************************
 * 统计公式说明
 * 
 * 【长期观测 - 配对样本】
 * 同一群体跨周期比较，假设高度相关
 * SE = √(p(1-p)/n)
 * MDE = Z × SE，其中 Z = Z_α/2 + Z_β
 * n = Z² × p(1-p) / δ²
 * 
 * 【AB测试 - 独立双样本】
 * 两个独立群体比较
 * SE = √(p₁(1-p₁)/n₁ + p₂(1-p₂)/n₂)
 * MDE = Z × SE
 * 
 * 当 p₁=p₂=p 且 n₁=n₂=n 时：
 * SE = √(2p(1-p)/n)
 * n = 2 × Z² × p(1-p) / δ²（每组）
 * 
 * 【页面加权 SE】
 * 长期观测：SE = √(Σ wᵢ² × pᵢ(1-pᵢ) / nᵢ)
 * AB测试：SE = √(Σ wᵢ² × [p₁ᵢ(1-p₁ᵢ)/n₁ᵢ + p₂ᵢ(1-p₂ᵢ)/n₂ᵢ])
 *         当两组权重相同时，简化为上述公式
 ******************************************************************************/

let scenario = 'monitoring';
const PAGES = ['L', 'D', 'B', 'O', 'M'];
const PAGE_NAMES = { L: 'List 列表页', D: 'Detail 详情页', B: 'Booking 预订页', O: 'Order 订单页', M: 'Message 订后短信' };
const Z_CI = { 0.90: 1.645, 0.95: 1.960, 0.99: 2.576 };

// 正态逆函数
function normInv(p) {
    if (p <= 0 || p >= 1) return p <= 0 ? -Infinity : Infinity;
    const a = [-39.69683028665376, 220.9460984245205, -275.9285104469687, 138.357751867269, -30.66479806614716, 2.506628277459239];
    const b = [-54.47609879822406, 161.5858368580409, -155.6989798598866, 66.80131188771972, -13.28068155288572];
    const c = [-0.007784894002430293, -0.3223964580411365, -2.400758277161838, -2.549732539343734, 4.374664141464968, 2.938163982698783];
    const d = [0.007784695709041462, 0.3224671290700398, 2.445134137142996, 3.754408661907416];
    const pLow = 0.02425;
    let q, r;
    if (p < pLow) {
        q = Math.sqrt(-2 * Math.log(p));
        return (((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5]) / ((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1);
    } else if (p <= 1 - pLow) {
        q = p - 0.5; r = q * q;
        return (((((a[0]*r+a[1])*r+a[2])*r+a[3])*r+a[4])*r+a[5])*q / (((((b[0]*r+b[1])*r+b[2])*r+b[3])*r+b[4])*r+1);
    } else {
        q = Math.sqrt(-2 * Math.log(1 - p));
        return -(((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5]) / ((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1);
    }
}

function getZ(alpha, power) { return normInv(1 - alpha/2) + normInv(power); }

// ========== 核心计算函数 ==========

/** 长期观测：计算样本量 */
function calcN_single(p, delta, alpha, power) {
    const z = getZ(alpha, power);
    return Math.ceil(z * z * p * (1-p) / (delta * delta));
}

/** 长期观测：计算MDE */
function calcMDE_single(p, n, alpha, power) {
    const z = getZ(alpha, power);
    return z * Math.sqrt(p * (1-p) / n);
}

/** AB测试（等样本）：计算每组样本量 */
function calcN_ab_equal(p, delta, alpha, power) {
    const z = getZ(alpha, power);
    return Math.ceil(2 * z * z * p * (1-p) / (delta * delta));
}

/** AB测试（不等样本）：计算MDE */
function calcMDE_ab(p1, n1, p2, n2, alpha, power) {
    const z = getZ(alpha, power);
    const se = Math.sqrt(p1*(1-p1)/n1 + p2*(1-p2)/n2);
    return z * se;
}

/** 计算SE（用于CI） */
function calcSE_single(p, n) { return Math.sqrt(p * (1-p) / n); }
function calcSE_ab(p1, n1, p2, n2) { return Math.sqrt(p1*(1-p1)/n1 + p2*(1-p2)/n2); }

/** 加权SE */
function calcWeightedSE_single(pages) {
    return Math.sqrt(pages.reduce((sum, pg) => sum + pg.w * pg.w * pg.p * (1-pg.p) / pg.n, 0));
}
function calcWeightedSE_ab(pages) {
    return Math.sqrt(pages.reduce((sum, pg) => {
        const var1 = pg.p1 * (1-pg.p1) / pg.n1;
        const var2 = pg.p2 * (1-pg.p2) / pg.n2;
        return sum + pg.w * pg.w * (var1 + var2);
    }, 0));
}

/** CI半宽 */
function calcCI(se, conf) { return Z_CI[conf] * se; }

// ========== UI 函数 ==========

function switchScenario(s) {
    scenario = s;
    document.querySelectorAll('.scenario-btn').forEach(btn => {
        btn.classList.remove('active', 'ab-test');
        if (btn.dataset.scenario === s) { btn.classList.add('active'); if (s === 'ab-test') btn.classList.add('ab-test'); }
    });
    document.getElementById('page-title').textContent = s === 'ab-test' ? 'AB 测试 ' : '长期观测 ';
    document.getElementById('scenario-badge').className = 'scenario-badge ' + (s === 'ab-test' ? 'ab-test' : 'monitoring');
    document.getElementById('scenario-badge').textContent = s === 'ab-test' ? '🧪 独立双样本' : '📈 配对样本';
    
    // 切换输入区
    document.getElementById('m1-monitoring').style.display = s === 'monitoring' ? 'block' : 'none';
    document.getElementById('m1-ab').style.display = s === 'ab-test' ? 'block' : 'none';
    document.getElementById('m2-monitoring').style.display = s === 'monitoring' ? 'block' : 'none';
    document.getElementById('m2-ab').style.display = s === 'ab-test' ? 'block' : 'none';
    
    updateInfoBoxes();
    initPageConfigs();
    document.getElementById('m1-results').classList.remove('visible');
    document.getElementById('m2-results').classList.remove('visible');
}

function switchMode(mode) {
    document.querySelectorAll('.switch-btn').forEach(btn => btn.classList.toggle('active', btn.dataset.mode === mode));
    document.getElementById('mode1').style.display = mode === 'mode1' ? 'block' : 'none';
    document.getElementById('mode2').style.display = mode === 'mode2' ? 'block' : 'none';
}

function updateInfoBoxes() {
    const m1 = document.getElementById('m1-info'), m2 = document.getElementById('m2-info');
    if (scenario === 'ab-test') {
        m1.className = 'info-box ab-test';
        m1.innerHTML = '<strong>💡 AB测试公式：</strong>每组 n = 2×Z²×p(1-p)/δ²，其中 Z = Z<sub>α/2</sub> + Z<sub>β</sub><br><strong>说明：</strong>两组独立，方差叠加需×2。1:1分配时效率最高。';
        m2.className = 'info-box ab-test';
        m2.innerHTML = '<strong>💡 AB测试公式：</strong>MDE = Z × √(p₁(1-p₁)/n₁ + p₂(1-p₂)/n₂)<br><strong>说明：</strong>支持两组不同的 p 值和样本量。';
    } else {
        m1.className = 'info-box';
        m1.innerHTML = '<strong>💡 长期观测公式：</strong>n = Z²×p(1-p)/δ²，其中 Z = Z<sub>α/2</sub> + Z<sub>β</sub><br><strong>说明：</strong>配对样本（同一群体跨周期），单组样本量。';
        m2.className = 'info-box';
        m2.innerHTML = '<strong>💡 长期观测公式：</strong>MDE = Z × √(p(1-p)/n)<br><strong>说明：</strong>可通过页面加权计算整体精度。';
    }
}

// 页面配置生成
function initPageConfigs() {
    for (let mode = 1; mode <= 2; mode++) {
        const gridHtml = PAGES.map(p => `<div><input type="checkbox" id="m${mode}-pg-${p}" class="page-checkbox" onchange="togglePage(${mode},'${p}')"><label for="m${mode}-pg-${p}" class="page-label">${p}<span class="page-full-name">${PAGE_NAMES[p]}</span></label></div>`).join('');
        document.getElementById(`m${mode}-page-grid`).innerHTML = gridHtml;
        
        let configHtml = '';
        for (const p of PAGES) {
            if (scenario === 'ab-test') {
                // AB测试：两个模式统一字段顺序和wording
                const nLabel1 = mode === 1 ? 'A组预估样本量' : 'A组样本量 n';
                const nLabel2 = mode === 1 ? 'B组预估样本量' : 'B组样本量 n';
                configHtml += `<div class="page-config" id="m${mode}-cfg-${p}">
                    <div class="page-config-header"><span class="page-badge ${p}">${p}</span><span style="color:var(--text-secondary)">${PAGE_NAMES[p]}</span></div>
                    <div class="form-grid" style="grid-template-columns:repeat(5,1fr);">
                        <div class="form-group"><label>权重 w</label><input type="number" id="m${mode}-${p}-w" placeholder="0.35" step="0.01" min="0" max="1"></div>
                        <div class="form-group"><label>A组预期比例 p</label><div class="input-suffix" data-suffix="%"><input type="number" id="m${mode}-${p}-p1" placeholder="70" step="0.1"></div></div>
                        <div class="form-group"><label>${nLabel1}</label><input type="number" id="m${mode}-${p}-n1" placeholder="5000" step="1"></div>
                        <div class="form-group"><label>B组预期比例 p</label><div class="input-suffix" data-suffix="%"><input type="number" id="m${mode}-${p}-p2" placeholder="70" step="0.1"></div></div>
                        <div class="form-group"><label>${nLabel2}</label><input type="number" id="m${mode}-${p}-n2" placeholder="5000" step="1"></div>
                    </div>
                    <div class="checkbox-row"><input type="checkbox" id="m${mode}-${p}-sync" checked onchange="syncPageP(${mode},'${p}')"><label for="m${mode}-${p}-sync">AB组预期比例 p 一致</label></div>
                </div>`;
            } else {
                // 长期观测：单组输入
                const nLabel = mode === 1 ? '预估样本量 n' : '实际样本量 n';
                configHtml += `<div class="page-config" id="m${mode}-cfg-${p}">
                    <div class="page-config-header"><span class="page-badge ${p}">${p}</span><span style="color:var(--text-secondary)">${PAGE_NAMES[p]}</span></div>
                    <div class="form-grid" style="grid-template-columns:repeat(3,1fr);">
                        <div class="form-group"><label>权重 w</label><input type="number" id="m${mode}-${p}-w" placeholder="0.35" step="0.01" min="0" max="1"></div>
                        <div class="form-group"><label>预期比例 p</label><div class="input-suffix" data-suffix="%"><input type="number" id="m${mode}-${p}-p" placeholder="70" step="0.1"></div></div>
                        <div class="form-group"><label>${nLabel}</label><input type="number" id="m${mode}-${p}-n" placeholder="5000" step="1"></div>
                    </div>
                </div>`;
            }
        }
        document.getElementById(`m${mode}-page-configs`).innerHTML = configHtml;
    }
}

function togglePage(mode, p) {
    const checked = document.getElementById(`m${mode}-pg-${p}`).checked;
    document.getElementById(`m${mode}-cfg-${p}`).classList.toggle('active', checked);
}

function applyPreset(mode, preset) {
    PAGES.forEach(p => {
        document.getElementById(`m${mode}-pg-${p}`).checked = false;
        document.getElementById(`m${mode}-cfg-${p}`).classList.remove('active');
    });
    if (preset === 'all') PAGES.forEach(p => { document.getElementById(`m${mode}-pg-${p}`).checked = true; document.getElementById(`m${mode}-cfg-${p}`).classList.add('active'); });
    else if (preset === 'db') ['D','B'].forEach(p => { document.getElementById(`m${mode}-pg-${p}`).checked = true; document.getElementById(`m${mode}-cfg-${p}`).classList.add('active'); });
}

function syncPageP(mode, p) {
    const syncCheckbox = document.getElementById(`m${mode}-${p}-sync`);
    if (syncCheckbox && syncCheckbox.checked) {
        document.getElementById(`m${mode}-${p}-p2`).value = document.getElementById(`m${mode}-${p}-p1`).value;
    }
}

// 同步全局p值
document.addEventListener('input', e => {
    if (e.target.id === 'm1-ab-p1' && document.getElementById('m1-sync-p').checked) document.getElementById('m1-ab-p2').value = e.target.value;
    if (e.target.id === 'm2-ab-p1' && document.getElementById('m2-sync-p').checked) document.getElementById('m2-ab-p2').value = e.target.value;
    // 页面级同步 - 两个模式都需要
    for (const p of PAGES) {
        for (const mode of [1, 2]) {
            const syncEl = document.getElementById(`m${mode}-${p}-sync`);
            if (e.target.id === `m${mode}-${p}-p1` && syncEl && syncEl.checked) {
                document.getElementById(`m${mode}-${p}-p2`).value = e.target.value;
            }
        }
    }
});

function getSelectedPages(mode) {
    const pages = [];
    for (const p of PAGES) {
        if (!document.getElementById(`m${mode}-pg-${p}`).checked) continue;
        const w = parseFloat(document.getElementById(`m${mode}-${p}-w`).value) || 0;
        
        if (scenario === 'ab-test') {
            // AB测试：两个模式都有 A/B 组分开的输入
            let p1 = (parseFloat(document.getElementById(`m${mode}-${p}-p1`).value) || 0) / 100;
            let p2 = (parseFloat(document.getElementById(`m${mode}-${p}-p2`).value) || 0) / 100;
            const syncEl = document.getElementById(`m${mode}-${p}-sync`);
            if (syncEl && syncEl.checked) p2 = p1;
            const n1 = parseInt(document.getElementById(`m${mode}-${p}-n1`).value) || 0;
            const n2 = parseInt(document.getElementById(`m${mode}-${p}-n2`).value) || 0;
            if (w > 0 && p1 > 0 && p2 > 0) {
                pages.push({ id: p, w, p1, p2, n1, n2, p: (p1+p2)/2 });
            }
        } else {
            // 长期观测：单组输入
            const pVal = (parseFloat(document.getElementById(`m${mode}-${p}-p`).value) || 0) / 100;
            const n = parseInt(document.getElementById(`m${mode}-${p}-n`).value) || 0;
            if (w > 0 && pVal > 0) pages.push({ id: p, w, p: pVal, n });
        }
    }
    return pages;
}

// ========== Mode 1: 精度 → 样本量 ==========
function calcMode1() {
    let p, p1, p2, delta, alpha, power;
    
    if (scenario === 'monitoring') {
        p = (parseFloat(document.getElementById('m1-p').value) || 0) / 100;
        delta = (parseFloat(document.getElementById('m1-delta').value) || 0) / 100;
        alpha = parseFloat(document.getElementById('m1-alpha').value) || 0.2;
        power = parseFloat(document.getElementById('m1-power').value) || 0.6;
        if (p <= 0 || p >= 1) { alert('请输入有效的 p 值 (0-100%)'); return; }
    } else {
        p1 = (parseFloat(document.getElementById('m1-ab-p1').value) || 0) / 100;
        p2 = document.getElementById('m1-sync-p').checked ? p1 : (parseFloat(document.getElementById('m1-ab-p2').value) || 0) / 100;
        delta = (parseFloat(document.getElementById('m1-ab-delta').value) || 0) / 100;
        alpha = parseFloat(document.getElementById('m1-ab-alpha').value) || 0.2;
        power = parseFloat(document.getElementById('m1-ab-power').value) || 0.6;
        p = (p1 + p2) / 2; // 用于计算的平均p
        if (p1 <= 0 || p1 >= 1 || p2 <= 0 || p2 >= 1) { alert('请输入有效的 p 值'); return; }
    }
    if (delta <= 0) { alert('请输入有效的 MDE δ'); return; }

    const z = getZ(alpha, power);
    const za = normInv(1 - alpha/2), zb = normInv(power);
    let html = '', formula = '';

    if (scenario === 'monitoring') {
        const n = Math.max(calcN_single(p, delta, alpha, power), 30);
        html = `<div class="result-summary">
            <div class="result-label">最小样本量（单组）</div>
            <div class="result-value">${n.toLocaleString()}</div>
            <div class="result-note">p=${(p*100).toFixed(1)}%, MDE=${(delta*100).toFixed(2)}%, α=${alpha}, Power=${power}</div>
        </div>`;
        formula = `<strong>公式：</strong>n = Z² × p(1-p) / δ²<br>
            <strong>其中：</strong>Z = Z<sub>α/2</sub> + Z<sub>β</sub> = ${za.toFixed(3)} + ${zb.toFixed(3)} = ${z.toFixed(3)}<br>
            <strong>计算：</strong>n = ${z.toFixed(3)}² × ${p.toFixed(4)} × ${(1-p).toFixed(4)} / ${delta.toFixed(4)}² = ${n.toLocaleString()}<br>
            <strong>验证：</strong>MDE = ${z.toFixed(3)} × √(${p.toFixed(4)}×${(1-p).toFixed(4)}/${n}) = ${(calcMDE_single(p,n,alpha,power)*100).toFixed(4)}% ✓`;
    } else {
        // AB测试：A组固定，计算B组最小样本量
        // 先从页面配置获取A组总样本量
        const pages = getSelectedPages(1);
        let totalN1 = 0; // A组总样本量（用户填写）
        let totalN2Min = 0; // B组最小样本量（计算）
        
        if (pages.length > 0 && pages.some(pg => pg.n1 > 0)) {
            // 有页面配置，按页面计算
            for (const pg of pages) {
                if (pg.n1 > 0) {
                    totalN1 += pg.n1;
                    const pageDelta = delta / pg.w;
                    const targetVar = (pageDelta / z) * (pageDelta / z);
                    const var1 = pg.p1 * (1 - pg.p1);
                    const var2 = pg.p2 * (1 - pg.p2);
                    const remainingVar = targetVar - var1 / pg.n1;
                    if (remainingVar > 0) {
                        totalN2Min += Math.ceil(var2 / remainingVar);
                    } else {
                        totalN2Min += 30;
                    }
                }
            }
        } else {
            // 没有页面配置，按1:1计算作为参考
            const nPerGroup = Math.max(calcN_ab_equal(p, delta, alpha, power), 30);
            totalN1 = nPerGroup;
            totalN2Min = nPerGroup;
        }
        
        const totalN = totalN1 + totalN2Min;
        html = `<div class="ab-result-grid">
            <div class="ab-result-card"><div class="ab-result-label">A 组（固定）</div><div class="ab-result-value">${totalN1.toLocaleString()}</div></div>
            <div class="ab-result-card"><div class="ab-result-label">B 组（最小）</div><div class="ab-result-value">${totalN2Min.toLocaleString()}</div></div>
            <div class="ab-result-card highlight"><div class="ab-result-label">总样本量</div><div class="ab-result-value">${totalN.toLocaleString()}</div></div>
        </div>
        <div class="result-note" style="text-align:center;">A组固定，B组为达到MDE所需最小样本量。p₁=${(p1*100).toFixed(1)}%, p₂=${(p2*100).toFixed(1)}%, MDE=${(delta*100).toFixed(2)}%</div>`;
        formula = `<strong>原理：</strong>A组样本量固定，计算B组最小样本量<br>
            <strong>公式：</strong>n₂ = p₂(1-p₂) / [(δ/Z)² - p₁(1-p₁)/n₁]<br>
            <strong>其中：</strong>Z = Z<sub>α/2</sub> + Z<sub>β</sub> = ${z.toFixed(3)}`;
    }

    // 页面详情
    const pagesForTable = getSelectedPages(1);
    document.getElementById('m1-page-title').style.display = pagesForTable.length ? 'flex' : 'none';
    document.getElementById('m1-table-container').style.display = pagesForTable.length ? 'block' : 'none';
    if (pagesForTable.length) {
        if (scenario === 'ab-test') {
            document.getElementById('m1-thead').innerHTML = '<tr><th>页面</th><th>权重</th><th>A组 p</th><th>B组 p</th><th>页面 δ</th><th>A组预估样本量(固定)</th><th>B组预估样本量</th><th>B组最小样本量</th><th>B组状态</th></tr>';
            let tbody = '';
            for (const pg of pagesForTable) {
                const pageDelta = delta / pg.w;
                // A组样本量固定，计算B组需要多少样本量
                const targetVar = (pageDelta / z) * (pageDelta / z);
                const var1 = pg.p1 * (1 - pg.p1);
                const var2 = pg.p2 * (1 - pg.p2);
                
                let pageN2Min;
                if (pg.n1 > 0) {
                    const remainingVar = targetVar - var1 / pg.n1;
                    if (remainingVar > 0) {
                        pageN2Min = Math.max(Math.ceil(var2 / remainingVar), 30);
                    } else {
                        pageN2Min = 30; // A组已足够大
                    }
                } else {
                    // 没有填A组样本量，按1:1计算作为参考
                    pageN2Min = Math.max(Math.ceil(2 * z * z * pg.p2 * (1-pg.p2) / (pageDelta * pageDelta)), 30);
                }
                
                // B组状态：B组预估 vs B组最小
                const status2 = pg.n2 > 0 ? (pg.n2 >= pageN2Min ? '✓ 充足' : '⚠ 不足') : '--';
                const statusClass2 = pg.n2 > 0 ? (pg.n2 >= pageN2Min ? 'success-cell' : 'warning-cell') : '';
                
                const n1Display = pg.n1 > 0 ? pg.n1.toLocaleString() : '--';
                const n2Display = pg.n2 > 0 ? pg.n2.toLocaleString() : '--';
                
                tbody += `<tr><td>${pg.id} 页</td><td>${pg.w.toFixed(2)}</td><td>${(pg.p1*100).toFixed(1)}%</td><td>${(pg.p2*100).toFixed(1)}%</td><td>${(pageDelta*100).toFixed(2)}%</td><td>${n1Display}</td><td>${n2Display}</td><td class="highlight-cell">${pageN2Min.toLocaleString()}</td><td class="${statusClass2}">${status2}</td></tr>`;
            }
            document.getElementById('m1-tbody').innerHTML = tbody;
        } else {
            document.getElementById('m1-thead').innerHTML = '<tr><th>页面</th><th>权重</th><th>预期比例 p</th><th>页面 δ</th><th>最小样本量</th><th>预估样本量</th><th>状态</th></tr>';
            let tbody = '';
            for (const pg of pagesForTable) {
                const pageDelta = delta / pg.w;
                const pageN = Math.max(calcN_single(pg.p, pageDelta, alpha, power), 30);
                const status = pg.n > 0 ? (pg.n >= pageN ? '✓ 充足' : '⚠ 不足') : '--';
                const statusClass = pg.n > 0 ? (pg.n >= pageN ? 'success-cell' : 'warning-cell') : '';
                const nDisplay = pg.n > 0 ? pg.n.toLocaleString() : '--';
                tbody += `<tr><td>${pg.id} 页</td><td>${pg.w.toFixed(2)}</td><td>${(pg.p*100).toFixed(1)}%</td><td>${(pageDelta*100).toFixed(2)}%</td><td class="highlight-cell">${pageN.toLocaleString()}</td><td>${nDisplay}</td><td class="${statusClass}">${status}</td></tr>`;
            }
            document.getElementById('m1-tbody').innerHTML = tbody;
        }
    }

    document.getElementById('m1-result-content').innerHTML = html;
    document.getElementById('m1-formula').innerHTML = formula;
    document.getElementById('m1-results').classList.add('visible');
}

// ========== Mode 2: 样本量 → 精度 ==========
function calcMode2() {
    let p, p1, p2, n, n1, n2, alpha, power;
    
    if (scenario === 'monitoring') {
        p = (parseFloat(document.getElementById('m2-p').value) || 0) / 100;
        n = parseInt(document.getElementById('m2-n').value) || 0;
        alpha = parseFloat(document.getElementById('m2-alpha').value) || 0.2;
        power = parseFloat(document.getElementById('m2-power').value) || 0.6;
    } else {
        p1 = (parseFloat(document.getElementById('m2-ab-p1').value) || 0) / 100;
        p2 = document.getElementById('m2-sync-p').checked ? p1 : (parseFloat(document.getElementById('m2-ab-p2').value) || 0) / 100;
        n1 = parseInt(document.getElementById('m2-ab-n1').value) || 0;
        n2 = parseInt(document.getElementById('m2-ab-n2').value) || 0;
        alpha = parseFloat(document.getElementById('m2-ab-alpha').value) || 0.2;
        power = parseFloat(document.getElementById('m2-ab-power').value) || 0.6;
        p = (p1 + p2) / 2;
    }

    const pages = getSelectedPages(2);
    const z = getZ(alpha, power);
    const za = normInv(1 - alpha/2), zb = normInv(power);
    let mde, se, html = '', formula = '';

    if (scenario === 'monitoring') {
        if (pages.length > 0) {
            // 加权计算
            se = calcWeightedSE_single(pages);
            mde = z * se;
            formula = `<strong>加权SE：</strong>SE = √(Σ wᵢ² × pᵢ(1-pᵢ)/nᵢ) = ${(se*100).toFixed(4)}%<br>
                <strong>MDE：</strong>δ = Z × SE = ${z.toFixed(3)} × ${(se*100).toFixed(4)}% = ${(mde*100).toFixed(4)}%`;
        } else if (n > 0) {
            if (p <= 0 || p >= 1) { alert('请输入有效的 p 值'); return; }
            se = calcSE_single(p, n);
            mde = calcMDE_single(p, n, alpha, power);
            formula = `<strong>SE：</strong>√(p(1-p)/n) = √(${p.toFixed(4)}×${(1-p).toFixed(4)}/${n}) = ${(se*100).toFixed(4)}%<br>
                <strong>MDE：</strong>δ = Z × SE = ${z.toFixed(3)} × ${(se*100).toFixed(4)}% = ${(mde*100).toFixed(4)}%<br>
                <strong>验证：</strong>n = Z²×p(1-p)/δ² = ${calcN_single(p, mde, alpha, power).toLocaleString()} ≈ ${n.toLocaleString()} ✓`;
        } else {
            alert('请输入样本量或配置页面参数'); return;
        }
        html = `<div class="result-summary">
            <div class="result-label">最小可检测效应 (MDE)</div>
            <div class="result-value">±${(mde*100).toFixed(2)}<span class="result-unit">%</span></div>
            <div class="result-note">α=${alpha}, Power=${power}</div>
        </div>`;
    } else {
        if (pages.length > 0) {
            se = calcWeightedSE_ab(pages);
            mde = z * se;
            formula = `<strong>加权SE：</strong>SE = √(Σ wᵢ² × [p₁ᵢ(1-p₁ᵢ)/n₁ᵢ + p₂ᵢ(1-p₂ᵢ)/n₂ᵢ]) = ${(se*100).toFixed(4)}%<br>
                <strong>MDE：</strong>δ = Z × SE = ${z.toFixed(3)} × ${(se*100).toFixed(4)}% = ${(mde*100).toFixed(4)}%`;
        } else if (n1 > 0 && n2 > 0) {
            if (p1 <= 0 || p1 >= 1 || p2 <= 0 || p2 >= 1) { alert('请输入有效的 p 值'); return; }
            se = calcSE_ab(p1, n1, p2, n2);
            mde = calcMDE_ab(p1, n1, p2, n2, alpha, power);
            formula = `<strong>SE：</strong>√(p₁(1-p₁)/n₁ + p₂(1-p₂)/n₂)<br>
                = √(${p1.toFixed(4)}×${(1-p1).toFixed(4)}/${n1} + ${p2.toFixed(4)}×${(1-p2).toFixed(4)}/${n2}) = ${(se*100).toFixed(4)}%<br>
                <strong>MDE：</strong>δ = Z × SE = ${z.toFixed(3)} × ${(se*100).toFixed(4)}% = ${(mde*100).toFixed(4)}%`;
        } else {
            alert('请输入两组样本量或配置页面参数'); return;
        }
        html = `<div class="result-summary">
            <div class="result-label">最小可检测效应 (MDE)</div>
            <div class="result-value">±${(mde*100).toFixed(2)}<span class="result-unit">%</span></div>
            <div class="result-note">A组: ${n1||'加权'}, B组: ${n2||'加权'}, α=${alpha}, Power=${power}</div>
        </div>`;
    }

    // CI Grid
    const ci90 = calcCI(se, 0.90), ci95 = calcCI(se, 0.95), ci99 = calcCI(se, 0.99);
    document.getElementById('m2-ci-grid').innerHTML = `
        <div class="ci-card"><div class="ci-level">90% CI</div><div class="ci-value">±${(ci90*100).toFixed(2)}%</div></div>
        <div class="ci-card"><div class="ci-level">95% CI</div><div class="ci-value">±${(ci95*100).toFixed(2)}%</div></div>
        <div class="ci-card primary"><div class="ci-level">99% CI</div><div class="ci-value">±${(ci99*100).toFixed(2)}%</div></div>`;

    // 页面详情
    document.getElementById('m2-page-title').style.display = pages.length ? 'flex' : 'none';
    document.getElementById('m2-table-container').style.display = pages.length ? 'block' : 'none';
    if (pages.length) {
        if (scenario === 'ab-test') {
            document.getElementById('m2-thead').innerHTML = '<tr><th>页面</th><th>权重</th><th>A组预期比例 p</th><th>A组样本量 n</th><th>B组预期比例 p</th><th>B组样本量 n</th><th>页面MDE</th></tr>';
            let tbody = '';
            for (const pg of pages) {
                const pgSE = Math.sqrt(pg.p1*(1-pg.p1)/pg.n1 + pg.p2*(1-pg.p2)/pg.n2);
                const pgMDE = z * pgSE;
                tbody += `<tr><td>${pg.id} 页</td><td>${pg.w.toFixed(2)}</td><td>${(pg.p1*100).toFixed(1)}%</td><td>${pg.n1.toLocaleString()}</td><td>${(pg.p2*100).toFixed(1)}%</td><td>${pg.n2.toLocaleString()}</td><td class="highlight-cell">±${(pgMDE*100).toFixed(2)}%</td></tr>`;
            }
            document.getElementById('m2-tbody').innerHTML = tbody;
        } else {
            document.getElementById('m2-thead').innerHTML = '<tr><th>页面</th><th>权重</th><th>预期比例 p</th><th>样本量 n</th><th>页面MDE</th><th>90%CI</th><th>95%CI</th><th>99%CI</th></tr>';
            let tbody = '';
            for (const pg of pages) {
                const pgMDE = calcMDE_single(pg.p, pg.n, alpha, power);
                tbody += `<tr><td>${pg.id} 页</td><td>${pg.w.toFixed(2)}</td><td>${(pg.p*100).toFixed(1)}%</td><td>${pg.n.toLocaleString()}</td><td class="highlight-cell">±${(pgMDE*100).toFixed(2)}%</td><td>±${(calcCI(calcSE_single(pg.p,pg.n),0.90)*100).toFixed(2)}%</td><td>±${(calcCI(calcSE_single(pg.p,pg.n),0.95)*100).toFixed(2)}%</td><td>±${(calcCI(calcSE_single(pg.p,pg.n),0.99)*100).toFixed(2)}%</td></tr>`;
            }
            document.getElementById('m2-tbody').innerHTML = tbody;
        }
    }

    document.getElementById('m2-result-content').innerHTML = html;
    document.getElementById('m2-formula').innerHTML = formula;
    document.getElementById('m2-results').classList.add('visible');
}

function resetMode(mode) {
    if (mode === 1) {
        ['m1-p', 'm1-delta', 'm1-ab-p1', 'm1-ab-p2', 'm1-ab-delta'].forEach(id => { const el = document.getElementById(id); if (el) el.value = ''; });
        ['m1-alpha', 'm1-ab-alpha'].forEach(id => { const el = document.getElementById(id); if (el) el.value = '0.2'; });
        ['m1-power', 'm1-ab-power'].forEach(id => { const el = document.getElementById(id); if (el) el.value = '0.6'; });
    } else {
        ['m2-p', 'm2-n', 'm2-ab-p1', 'm2-ab-p2', 'm2-ab-n1', 'm2-ab-n2'].forEach(id => { const el = document.getElementById(id); if (el) el.value = ''; });
        ['m2-alpha', 'm2-ab-alpha'].forEach(id => { const el = document.getElementById(id); if (el) el.value = '0.2'; });
        ['m2-power', 'm2-ab-power'].forEach(id => { const el = document.getElementById(id); if (el) el.value = '0.6'; });
    }
    PAGES.forEach(p => {
        document.getElementById(`m${mode}-pg-${p}`).checked = false;
        document.getElementById(`m${mode}-cfg-${p}`).classList.remove('active');
    });
    document.getElementById(`m${mode}-results`).classList.remove('visible');
}

document.addEventListener('DOMContentLoaded', () => { updateInfoBoxes(); initPageConfigs(); });
