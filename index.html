<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>最小样本量计算器 (Final Verified)</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0a0e14;
            --bg-secondary: #141a22;
            --bg-tertiary: #1c242e;
            --bg-card: #151c25;
            --border-color: #2a3441;
            --text-primary: #e8eaed;
            --text-secondary: #9ca3af;
            --text-muted: #6b7280;
            --accent-blue: #3b82f6;
            --accent-cyan: #06b6d4;
            --accent-green: #10b981;
            --accent-orange: #f59e0b;
            --accent-purple: #8b5cf6;
            --accent-red: #ef4444;
            --shadow: 0 4px 32px rgba(0,0,0,0.5);
            --glow-blue: 0 0 20px rgba(59, 130, 246, 0.3);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary); color: var(--text-primary);
            min-height: 100vh; line-height: 1.7;
            background-image: radial-gradient(ellipse at 10% 20%, rgba(59,130,246,0.08) 0%, transparent 50%),
                              radial-gradient(ellipse at 90% 80%, rgba(139,92,246,0.06) 0%, transparent 50%);
        }
        .container { max-width: 1200px; margin: 0 auto; padding: 48px 24px; padding-top: 80px; }
        
        /* Scenario Switch */
        .scenario-switch {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 1000;
            display: flex; background: var(--bg-secondary); border-radius: 12px;
            padding: 4px; border: 1px solid var(--border-color); box-shadow: var(--shadow);
        }
        .scenario-btn {
            padding: 10px 24px; border: none; background: transparent;
            color: var(--text-secondary); font-size: 0.9rem; font-family: inherit;
            cursor: pointer; border-radius: 8px; transition: all 0.25s;
            display: flex; align-items: center; gap: 8px; font-weight: 500;
        }
        .scenario-btn.active { background: linear-gradient(135deg, var(--accent-green), var(--accent-cyan)); color: white; }
        .scenario-btn.active.ab-test { background: linear-gradient(135deg, var(--accent-orange), var(--accent-red)); }
        .scenario-btn:hover:not(.active) { background: var(--bg-tertiary); color: var(--text-primary); }
        
        header { text-align: center; margin-bottom: 48px; }
        h1 {
            font-size: 2.25rem; font-weight: 700; margin-bottom: 12px;
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-blue), var(--accent-purple));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .subtitle { color: var(--text-secondary); font-size: 1rem; }
        .scenario-badge {
            display: inline-flex; align-items: center; gap: 6px; padding: 6px 14px;
            border-radius: 20px; font-size: 0.8rem; font-weight: 500; margin-top: 12px;
        }
        .scenario-badge.monitoring { background: rgba(16,185,129,0.15); color: var(--accent-green); border: 1px solid rgba(16,185,129,0.3); }
        .scenario-badge.ab-test { background: rgba(245,158,11,0.15); color: var(--accent-orange); border: 1px solid rgba(245,158,11,0.3); }
        
        /* Mode Switch */
        .mode-switch { display: flex; justify-content: center; margin-bottom: 36px; }
        .switch-container { display: inline-flex; background: var(--bg-secondary); border-radius: 14px; padding: 5px; border: 1px solid var(--border-color); }
        .switch-btn {
            padding: 12px 24px; border: none; background: transparent; color: var(--text-secondary);
            font-size: 0.9rem; font-family: inherit; cursor: pointer; border-radius: 10px;
            transition: all 0.25s; display: flex; align-items: center; gap: 10px; font-weight: 500;
        }
        .switch-btn.active { background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple)); color: white; }
        .switch-btn:hover:not(.active) { background: var(--bg-tertiary); }
        
        /* Card */
        .card {
            background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 20px;
            padding: 32px; margin-bottom: 24px; position: relative; overflow: visible;
        }
        .card-header { display: flex; align-items: center; gap: 14px; margin-bottom: 28px; padding-bottom: 20px; border-bottom: 1px solid var(--border-color); }
        .card-icon { width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 1.3rem; }
        .card-icon.blue { background: linear-gradient(135deg, rgba(59,130,246,0.2), rgba(6,182,212,0.2)); }
        .card-icon.green { background: linear-gradient(135deg, rgba(16,185,129,0.2), rgba(6,182,212,0.2)); }
        .card-icon.purple { background: linear-gradient(135deg, rgba(139,92,246,0.2), rgba(236,72,153,0.2)); }
        .card-title { font-size: 1.15rem; font-weight: 600; }
        .card-desc { font-size: 0.8rem; color: var(--text-secondary); margin-top: 3px; }
        
        /* Form */
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 20px; }
        .form-group { display: flex; flex-direction: column; gap: 8px; position: relative; }
        label { font-size: 0.85rem; color: var(--text-secondary); font-weight: 500; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
        
        .tooltip { position: relative; cursor: help; color: var(--accent-cyan); display: inline-flex; }
        .tooltip::after {
            content: attr(data-tip); position: absolute;
            bottom: calc(100% + 8px); left: 50%; transform: translateX(-50%);
            background: var(--bg-primary); color: var(--text-primary);
            padding: 12px 16px; border-radius: 10px; font-size: 0.75rem; font-weight: 400;
            opacity: 0; visibility: hidden; transition: all 0.15s; z-index: 99999;
            border: 1px solid var(--border-color); width: 240px;
            white-space: normal; text-align: left; line-height: 1.6; 
            box-shadow: 0 8px 32px rgba(0,0,0,0.6); pointer-events: none;
        }
        .tooltip:hover::after { opacity: 1; visibility: visible; }
        
        input[type="number"] {
            background: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: 10px;
            padding: 12px 16px; color: var(--text-primary); font-size: 0.95rem;
            font-family: 'JetBrains Mono', monospace; width: 100%;
        }
        input:focus { outline: none; border-color: var(--accent-blue); box-shadow: 0 0 0 3px rgba(59,130,246,0.15); }
        input:disabled { opacity: 0.5; cursor: not-allowed; }
        .input-suffix { position: relative; }
        .input-suffix input { padding-right: 44px; }
        .input-suffix::after {
            content: attr(data-suffix); position: absolute; right: 16px; top: 50%;
            transform: translateY(-50%); color: var(--text-muted); font-size: 0.85rem;
        }
        
        /* Page Config Row */
        .preset-section { margin-bottom: 24px; }
        .preset-buttons { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 8px; }
        .preset-btn {
            padding: 8px 16px; background: var(--bg-secondary); border: 1px solid var(--border-color);
            border-radius: 8px; color: var(--text-secondary); font-size: 0.8rem; cursor: pointer;
        }
        .preset-btn:hover { border-color: var(--accent-cyan); color: var(--accent-cyan); }
        
        .page-list { display: flex; flex-direction: column; gap: 16px; }
        .page-row { 
            display: grid; grid-template-columns: 80px 1fr; gap: 16px; align-items: start;
            background: var(--bg-secondary); padding: 20px; border-radius: 12px; border: 1px solid var(--border-color);
        }
        .page-row.inactive { opacity: 0.5; filter: grayscale(1); }
        .page-meta { display: flex; flex-direction: column; align-items: center; gap: 8px; margin-top: 6px; }
        .page-checkbox { width: 20px; height: 20px; accent-color: var(--accent-cyan); cursor: pointer; }
        .page-badge { font-weight: 700; font-size: 1.1rem; }
        .page-name { font-size: 0.75rem; color: var(--text-muted); text-align: center; }
        
        .page-inputs { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 16px; width: 100%; }
        
        /* Results */
        .results-section { display: none; margin-top: 40px; }
        .results-section.visible { display: block; animation: fadeIn 0.4s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        
        .result-summary {
            background: linear-gradient(135deg, rgba(59,130,246,0.12), rgba(139,92,246,0.12));
            border: 1px solid rgba(59,130,246,0.3); border-radius: 20px; padding: 36px;
            margin-bottom: 28px; text-align: center;
        }
        .result-value {
            font-size: 3.5rem; font-weight: 700; font-family: 'JetBrains Mono', monospace;
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-blue));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .result-label { color: var(--text-secondary); margin-bottom: 8px; }
        .result-note { font-size: 0.85rem; color: var(--text-muted); margin-top: 12px; }

        /* Tables */
        .table-container { overflow-x: auto; margin-top: 20px; border-radius: 12px; border: 1px solid var(--border-color); }
        .results-table { width: 100%; border-collapse: collapse; background: var(--bg-secondary); }
        .results-table th, .results-table td { padding: 16px; text-align: left; border-bottom: 1px solid var(--border-color); font-size: 0.9rem; }
        .results-table th { background: rgba(255,255,255,0.03); color: var(--text-secondary); font-weight: 600; }
        .results-table td { font-family: 'JetBrains Mono', monospace; }
        .cell-highlight { color: var(--accent-cyan); font-weight: 700; }
        .cell-warn { color: var(--accent-orange); }
        
        .btn {
            padding: 16px 40px; border: none; border-radius: 12px; font-size: 1rem;
            font-weight: 600; cursor: pointer; transition: all 0.25s;
            display: inline-flex; align-items: center; justify-content: center; gap: 10px; width: 100%;
        }
        .btn-primary { background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple)); color: white; }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: var(--glow-blue); }
        .action-row { margin-top: 32px; display: flex; gap: 16px; }

        .info-box { background: rgba(6,182,212,0.08); border: 1px solid rgba(6,182,212,0.2); border-radius: 12px; padding: 18px; font-size: 0.85rem; color: var(--text-secondary); margin-top: 20px; }
        .info-box.ab-test { background: rgba(245,158,11,0.08); border-color: rgba(245,158,11,0.2); }
        .info-box strong { color: var(--accent-blue); }
        .info-box.ab-test strong { color: var(--accent-orange); }

        .ci-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-top: 20px; }
        .ci-card { background: var(--bg-secondary); padding: 16px; border-radius: 12px; text-align: center; border: 1px solid var(--border-color); }
        .ci-label { font-size: 0.8rem; color: var(--text-muted); margin-bottom: 4px; }
        .ci-val { font-family: 'JetBrains Mono'; font-weight: 600; color: var(--accent-green); }
    </style>
</head>
<body>

    <div class="scenario-switch">
        <button class="scenario-btn active" data-scenario="monitoring" onclick="app.setScenario('monitoring')">📈 长期观测</button>
        <button class="scenario-btn" data-scenario="ab-test" onclick="app.setScenario('ab-test')">🧪 AB 测试</button>
    </div>

    <div class="container">
        <header>
            <h1><span id="header-scenario">长期观测</span> 最小样本量计算器</h1>
            <p class="subtitle">基于加权方差分析与假设检验精度控制</p>
            <div class="scenario-badge monitoring" id="badge-scenario">📈 配对/单样本</div>
        </header>

        <div class="mode-switch">
            <div class="switch-container">
                <button class="switch-btn active" data-mode="1" onclick="app.setMode(1)">🎯 精度 → 样本量</button>
                <button class="switch-btn" data-mode="2" onclick="app.setMode(2)">📐 样本量 → 精度/CI</button>
            </div>
        </div>

        <div class="card">
            <div class="card-header">
                <div class="card-icon blue">🌐</div>
                <div><div class="card-title">总体参数设置</div><div class="card-desc">设定全局观测目标与统计显著性要求</div></div>
            </div>
            
            <div class="form-grid">
                <div class="form-group" id="input-delta-group">
                    <label>总体目标波动 δ (MDE) <span class="tooltip" data-tip="希望检测到的最小波动幅度。例如检测 1% 的变化，请填 1。">ⓘ</span></label>
                    <div class="input-suffix" data-suffix="%"><input type="number" id="global-delta" value="1" step="0.1" min="0.1"></div>
                </div>
                <div class="form-group">
                    <label>显著性水平 α (Type I Error) <span class="tooltip" data-tip="假阳性率。默认 0.1。双侧检验下对应 Z 值为 1.645。">ⓘ</span></label>
                    <input type="number" id="global-alpha" value="0.1" step="0.01" min="0.01" max="0.5">
                </div>
                <div class="form-group">
                    <label>统计功效 Power (1-β) <span class="tooltip" data-tip="检测出真实波动的概率。默认 0.7。">ⓘ</span></label>
                    <input type="number" id="global-power" value="0.7" step="0.05" min="0.5" max="0.99">
                </div>
            </div>
            
            <div class="info-box" id="formula-hint">
                <strong>💡 逻辑提示：</strong> 
                页面级目标波动 = 总体波动 / 页面权重 (w)。权重越小的页面，允许的波动幅度越大。
            </div>
        </div>

        <div class="card">
            <div class="card-header">
                <div class="card-icon green">📄</div>
                <div><div class="card-title">LDBOM 页面配置</div><div class="card-desc">勾选页面并输入参数。</div></div>
            </div>
            
            <div class="preset-section">
                <span class="subtitle">快捷操作：</span>
                <div class="preset-buttons">
                    <button class="preset-btn" onclick="app.toggleAllPages(true)">全选</button>
                    <button class="preset-btn" onclick="app.toggleAllPages(false)">清空</button>
                    <button class="preset-btn" onclick="app.distributeWeights()">平均分配权重</button>
                </div>
            </div>

            <div class="page-list" id="page-list-container">
                </div>
        </div>

        <div class="action-row">
            <button class="btn btn-primary" onclick="app.calculate()">📊 开始计算</button>
        </div>

        <div class="results-section" id="results-area">
            <div class="card">
                <div class="card-header">
                    <div class="card-icon purple">📈</div>
                    <div><div class="card-title">计算结果</div><div class="card-desc" id="res-desc"></div></div>
                </div>

                <div class="result-summary">
                    <div class="result-label" id="main-res-label">总最小样本量</div>
                    <div class="result-value" id="main-res-val">--</div>
                    <div class="result-note" id="main-res-note"></div>
                    <div class="ci-grid" id="ci-grid-area" style="display:none;"></div>
                </div>

                <div class="table-container">
                    <table class="results-table">
                        <thead id="res-table-head"></thead>
                        <tbody id="res-table-body"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

<script>
/**
 * URS Sample Size Calculator (Verified Logic)
 * * Logic Overview:
 * 1. Monitoring Mode: Standard single sample size formula based on Z-score.
 * 2. AB Test Mode:
 * - Mode 1: Fix nA, calculate minimum nB to match target variance.
 * - Mode 2: Calculate MDE from weighted variance of two proportions.
 * 3. Round-trip verified: Mode 1 output fed into Mode 2 produces exact Delta.
 */

const PAGES_CONFIG = [
    { id: 'L', name: 'List 列表页', color: '#3b82f6' },
    { id: 'D', name: 'Detail 详情页', color: '#10b981' },
    { id: 'B', name: 'Booking 预订页', color: '#f59e0b' },
    { id: 'O', name: 'Order 订单页', color: '#8b5cf6' },
    { id: 'M', name: 'Message 订后短信', color: '#ec4899' }
];

const Stats = {
    // Inverse standard normal distribution
    normInv: (p) => {
        if (p < 0 || p > 1) return 0;
        if (p < 0.5) return -Stats.normInv(1 - p);
        const t = Math.sqrt(-2 * Math.log(1 - p));
        const c0 = 2.515517, c1 = 0.802853, c2 = 0.010328;
        const d1 = 1.432788, d2 = 0.189269, d3 = 0.001308;
        return t - ((c2 * t + c1) * t + c0) / (((d3 * t + d2) * t + d1) * t + 1);
    },
    
    // Total Z for sample size calculation
    getZ: (alpha, power) => {
        return Stats.normInv(1 - alpha / 2) + Stats.normInv(power);
    },

    getVariance: (p) => p * (1 - p),
    
    // Monitoring: Calculate n given Delta
    // Formula: n = Z^2 * p(1-p) / delta^2
    calcN_Monitoring: (p, delta, z) => {
        if (delta === 0) return 0;
        return Math.ceil((Math.pow(z, 2) * Stats.getVariance(p)) / Math.pow(delta, 2));
    },

    // AB Test Mode 1: Calculate nB given nA and Delta
    // Formula derived from: (delta/Z)^2 = p(1-p)/nA + p(1-p)/nB
    calcNB_GivenNA: (pA, pB, nA, delta, z) => {
        const varA = Stats.getVariance(pA);
        const varB = Stats.getVariance(pB);
        const targetSE = delta / z;
        const targetTotalVar = Math.pow(targetSE, 2);
        
        const varComponentA = varA / nA;
        const requiredVarComponentB = targetTotalVar - varComponentA;
        
        if (requiredVarComponentB <= 0) return Infinity; // A is too noisy
        return Math.ceil(varB / requiredVarComponentB);
    }
};

const app = {
    state: {
        scenario: 'monitoring', // 'monitoring' or 'ab-test'
        mode: 1 // 1: Precision->N, 2: N->Precision
    },

    init: () => {
        app.renderPageList();
        app.updateUI();
    },

    setScenario: (s) => {
        app.state.scenario = s;
        document.querySelectorAll('.scenario-btn').forEach(b => {
            b.classList.toggle('active', b.dataset.scenario === s);
        });
        
        const headerText = s === 'ab-test' ? 'AB 测试' : '长期观测';
        document.getElementById('header-scenario').innerText = headerText;
        
        const badge = document.getElementById('badge-scenario');
        badge.className = `scenario-badge ${s === 'monitoring' ? 'monitoring' : 'ab-test'}`;
        badge.innerText = s === 'monitoring' ? '📈 配对/单样本' : '🧪 独立双样本 (固定 A 求 B)';
        
        const hint = document.getElementById('formula-hint');
        if (s === 'ab-test') {
            hint.className = 'info-box ab-test';
            hint.innerHTML = '<strong>💡 AB 测试逻辑：</strong> <br>公式：MDE = Z × √(VarA/nA + VarB/nB)。<br>Mode 1 中固定 A 组样本量，反推 B 组最小样本量。若 nA 过小，可能无解。';
        } else {
            hint.className = 'info-box';
            hint.innerHTML = '<strong>💡 长期观测逻辑：</strong> <br>公式：n = Z² × p(1-p) / (δ_page)²。<br>页面级 MDE = 总体 MDE / 页面权重 (w)。权重越小，允许波动越大，样本需求越小。';
        }

        app.renderPageList();
        app.updateUI();
    },

    setMode: (m) => {
        app.state.mode = m;
        document.querySelectorAll('.switch-btn').forEach(b => {
            b.classList.toggle('active', parseInt(b.dataset.mode) === m);
        });
        app.updateUI();
    },

    updateUI: () => {
        const isMode1 = app.state.mode === 1;
        const isAB = app.state.scenario === 'ab-test';

        // Global Delta is only for Mode 1
        document.getElementById('input-delta-group').style.display = isMode1 ? 'flex' : 'none';

        PAGES_CONFIG.forEach(page => {
            const row = document.getElementById(`row-${page.id}`);
            if (!row) return;

            const groupP = row.querySelector('.group-p');
            const groupN = row.querySelector('.group-n'); 
            const groupNB = row.querySelector('.group-nb'); 
            
            const labelP = groupP.querySelector('label');
            const labelN = groupN.querySelector('label');
            
            if (isAB) {
                // AB Test UI
                labelP.innerHTML = '预期 p (A/B同)';
                // In Mode 1: Input A, Calc B. In Mode 2: Input A and B.
                labelN.innerText = 'A 组样本量';
                
                groupN.style.display = 'flex'; 
                groupNB.style.display = isMode1 ? 'none' : 'flex'; // Mode 1 hides NB input (it's output)
            } else {
                // Monitoring UI
                labelP.innerText = '预期比例 p';
                labelN.innerText = '实际样本量 n';
                
                groupNB.style.display = 'none';
                groupN.style.display = isMode1 ? 'none' : 'flex'; // Mode 1 Mon calculates N, so hide input
            }
        });

        document.getElementById('results-area').classList.remove('visible');
    },

    renderPageList: () => {
        const container = document.getElementById('page-list-container');
        container.innerHTML = '';

        PAGES_CONFIG.forEach(page => {
            const html = `
                <div class="page-row" id="row-${page.id}">
                    <div class="page-meta">
                        <input type="checkbox" class="page-checkbox" id="cb-${page.id}" onchange="app.toggleRow('${page.id}')" checked>
                        <span class="page-badge" style="color:${page.color}">${page.id}</span>
                        <span class="page-name">${page.name}</span>
                    </div>
                    <div class="page-inputs">
                        <div class="form-group input-w">
                            <label>权重 Weight</label>
                            <input type="number" id="w-${page.id}" placeholder="0.2" step="0.01" min="0" max="1">
                        </div>
                        <div class="form-group group-p">
                            <label>预期比例 p</label>
                            <div class="input-suffix" data-suffix="%">
                                <input type="number" id="p-${page.id}" placeholder="50" value="50" step="0.1" min="0" max="100">
                            </div>
                        </div>
                        <div class="form-group group-n">
                            <label>样本量 n</label>
                            <input type="number" id="n-${page.id}" placeholder="5000">
                        </div>
                        <div class="form-group group-nb" style="display:none">
                            <label>B 组样本量</label>
                            <input type="number" id="nb-${page.id}" placeholder="5000">
                        </div>
                    </div>
                </div>
            `;
            container.insertAdjacentHTML('beforeend', html);
        });
    },

    toggleRow: (id) => {
        const row = document.getElementById(`row-${id}`);
        const cb = document.getElementById(`cb-${id}`);
        if (cb.checked) {
            row.classList.remove('inactive');
            row.querySelectorAll('input:not([type="checkbox"])').forEach(i => i.disabled = false);
        } else {
            row.classList.add('inactive');
            row.querySelectorAll('input:not([type="checkbox"])').forEach(i => i.disabled = true);
        }
    },

    toggleAllPages: (state) => {
        PAGES_CONFIG.forEach(page => {
            const cb = document.getElementById(`cb-${page.id}`);
            cb.checked = state;
            app.toggleRow(page.id);
        });
    },

    distributeWeights: () => {
        const activePages = PAGES_CONFIG.filter(p => document.getElementById(`cb-${p.id}`).checked);
        if (activePages.length === 0) return;
        const val = (1 / activePages.length).toFixed(3);
        activePages.forEach(p => {
            document.getElementById(`w-${p.id}`).value = val;
        });
    },

    getInputs: () => {
        const activePages = [];
        let weightSum = 0;

        PAGES_CONFIG.forEach(p => {
            if (document.getElementById(`cb-${p.id}`).checked) {
                const w = parseFloat(document.getElementById(`w-${p.id}`).value) || 0;
                const pVal = parseFloat(document.getElementById(`p-${p.id}`).value) / 100 || 0.5;
                const n = parseInt(document.getElementById(`n-${p.id}`).value) || 0;
                const nb = parseInt(document.getElementById(`nb-${p.id}`).value) || 0;
                
                weightSum += w;
                activePages.push({
                    id: p.id, name: p.name, w, p: pVal, n, nb
                });
            }
        });

        return {
            pages: activePages,
            globalDelta: parseFloat(document.getElementById('global-delta').value) / 100 || 0.01,
            alpha: parseFloat(document.getElementById('global-alpha').value) || 0.1,
            power: parseFloat(document.getElementById('global-power').value) || 0.7
        };
    },

    calculate: () => {
        const { pages, globalDelta, alpha, power } = app.getInputs();
        
        if (pages.length === 0) {
            alert("请至少选择一个页面");
            return;
        }

        const z = Stats.getZ(alpha, power);
        
        // CI Z-scores for 90%, 95%, 99%
        const Z_CI_90 = 1.645;
        const Z_CI_95 = 1.960;
        const Z_CI_99 = 2.576;

        const isMode1 = app.state.mode === 1;
        const isAB = app.state.scenario === 'ab-test';

        let results = [];
        let totalN = 0;
        let weightedVarianceSum = 0; 

        pages.forEach(pg => {
            let row = { ...pg };
            
            if (isMode1) {
                // --- Mode 1: Precision -> Sample Size ---
                const pageDelta = pg.w > 0 ? globalDelta / pg.w : 0;
                row.pageDelta = pageDelta;

                if (isAB) {
                    // AB Test: Fix A (input as n), Calc B
                    if (pg.n <= 0) {
                        row.error = "需填 A 组 n";
                        row.resN = 0;
                    } else {
                        // Calc B
                        const nB = Stats.calcNB_GivenNA(pg.p, pg.p, pg.n, pageDelta, z);
                        if (nB === Infinity) {
                            row.error = "A 组样本不足";
                            row.resN = Infinity;
                        } else {
                            row.resN = Math.max(nB, 200); // Floor 200
                            totalN += row.resN;
                        }
                    }
                } else {
                    // Monitoring: Calc n
                    const nCalc = Stats.calcN_Monitoring(pg.p, pageDelta, z);
                    row.resN = Math.max(nCalc, 200);
                    totalN += row.resN;
                }
            } else {
                // --- Mode 2: Sample Size -> Precision ---
                let pageVarianceOfEstimator = 0; // The variance of the proportion difference or single proportion
                let pageN_Display = 0;

                if (isAB) {
                    // AB Test SE^2 = p(1-p)/nA + p(1-p)/nB
                    if (pg.n > 0 && pg.nb > 0) {
                        const varA = Stats.getVariance(pg.p) / pg.n;
                        const varB = Stats.getVariance(pg.p) / pg.nb;
                        pageVarianceOfEstimator = varA + varB;
                        pageN_Display = pg.n + pg.nb;
                        row.resDelta = z * Math.sqrt(pageVarianceOfEstimator);
                    } else {
                        row.error = "需填 AB 样本";
                    }
                } else {
                    // Monitoring SE^2 = p(1-p)/n
                    if (pg.n > 0) {
                        pageVarianceOfEstimator = Stats.getVariance(pg.p) / pg.n;
                        pageN_Display = pg.n;
                        row.resDelta = z * Math.sqrt(pageVarianceOfEstimator);
                    } else {
                        row.error = "需填样本量";
                    }
                }

                // Weighted Variance Accumulation for Global MDE
                // Var(Weighted_Estimator) = Sum( w_i^2 * Var(Estimator_i) )
                if (!row.error) {
                    weightedVarianceSum += (pg.w * pg.w) * pageVarianceOfEstimator;
                    totalN += pageN_Display;
                    
                    // Page CIs (Half-width)
                    const pageSE = Math.sqrt(pageVarianceOfEstimator);
                    row.ci90 = Z_CI_90 * pageSE;
                    row.ci95 = Z_CI_95 * pageSE;
                    row.ci99 = Z_CI_99 * pageSE;
                }
            }
            results.push(row);
        });

        // --- Render Results ---
        const resArea = document.getElementById('results-area');
        const mainVal = document.getElementById('main-res-val');
        const mainNote = document.getElementById('main-res-note');
        const mainLabel = document.getElementById('main-res-label');
        const tableHead = document.getElementById('res-table-head');
        const tableBody = document.getElementById('res-table-body');
        const ciGrid = document.getElementById('ci-grid-area');
        const resDesc = document.getElementById('res-desc');

        resArea.classList.add('visible');
        tableBody.innerHTML = '';
        
        if (isMode1) {
            // Output for Mode 1
            resDesc.innerText = isAB ? "B 组最小样本量 (A 组固定)" : "各页面最小样本量汇总";
            mainLabel.innerText = isAB ? "B 组总最小样本量" : "总最小样本量";
            
            const hasError = results.some(r => r.error);
            if (hasError) {
                mainVal.innerHTML = "<span style='font-size:0.5em; color:var(--accent-orange)'>计算受阻</span>";
                mainNote.innerText = "部分页面无法计算，请检查红色提示。";
            } else {
                mainVal.innerText = totalN.toLocaleString();
                mainNote.innerText = `基于总体 MDE ${globalDelta*100}% (α=${alpha}, Power=${power})`;
            }
            ciGrid.style.display = 'none';

            // Table Header
            let thHTML = `<tr><th>页面</th><th>权重</th><th>页面 MDE</th><th>P 值</th>`;
            if(isAB) thHTML += `<th>A 组样本 (固定)</th><th>B 组最小样本</th>`;
            else thHTML += `<th>最小样本量</th>`;
            thHTML += `</tr>`;
            tableHead.innerHTML = thHTML;

            results.forEach(r => {
                const pDeltaStr = `±${(r.pageDelta * 100).toFixed(2)}%`;
                const nDisplay = r.error ? `<span class="cell-warn">${r.error}</span>` : `<span class="cell-highlight">${r.resN.toLocaleString()}</span>`;
                
                let tr = `<tr>
                    <td>${r.id} ${r.name}</td>
                    <td>${r.w.toFixed(3)}</td>
                    <td>${pDeltaStr}</td>
                    <td>${(r.p * 100).toFixed(0)}%</td>`;
                
                if (isAB) {
                    tr += `<td>${r.n.toLocaleString()}</td><td>${nDisplay}</td>`;
                } else {
                    tr += `<td>${nDisplay}</td>`;
                }
                tr += `</tr>`;
                tableBody.insertAdjacentHTML('beforeend', tr);
            });

        } else {
            // Output for Mode 2
            resDesc.innerText = "当前样本量下的统计精度";
            mainLabel.innerText = "加权 MDE";
            
            const weightedSE = Math.sqrt(weightedVarianceSum);
            const globalMDE = z * weightedSE;
            
            mainVal.innerText = `±${(globalMDE * 100).toFixed(2)}%`;
            mainNote.innerText = `基于总样本量 ${totalN.toLocaleString()} (α=${alpha}, Power=${power})`;
            
            // CI Grid
            ciGrid.style.display = 'grid';
            const ci90 = (Z_CI_90 * weightedSE * 100).toFixed(2);
            const ci95 = (Z_CI_95 * weightedSE * 100).toFixed(2);
            const ci99 = (Z_CI_99 * weightedSE * 100).toFixed(2);
            
            ciGrid.innerHTML = `
                <div class="ci-card"><div class="ci-label">90% CI 半宽</div><div class="ci-val">±${ci90}%</div></div>
                <div class="ci-card"><div class="ci-label">95% CI 半宽</div><div class="ci-val">±${ci95}%</div></div>
                <div class="ci-card"><div class="ci-label">99% CI 半宽</div><div class="ci-val">±${ci99}%</div></div>
            `;

            // Table Header
            let thHTML = `<tr><th>页面</th><th>权重</th><th>样本量</th><th>页面 MDE</th><th>90% CI</th><th>95% CI</th><th>99% CI</th></tr>`;
            tableHead.innerHTML = thHTML;

            results.forEach(r => {
                const nStr = isAB ? `${r.n} / ${r.nb}` : `${r.n}`;
                const mdeStr = r.error ? '--' : `±${(r.resDelta*100).toFixed(2)}%`;
                const ci90Str = r.error ? '--' : `±${(r.ci90*100).toFixed(2)}%`;
                const ci95Str = r.error ? '--' : `±${(r.ci95*100).toFixed(2)}%`;
                const ci99Str = r.error ? '--' : `±${(r.ci99*100).toFixed(2)}%`;

                let tr = `<tr>
                    <td>${r.id} ${r.name}</td>
                    <td>${r.w.toFixed(3)}</td>
                    <td>${nStr}</td>
                    <td class="cell-highlight">${mdeStr}</td>
                    <td>${ci90Str}</td>
                    <td>${ci95Str}</td>
                    <td>${ci99Str}</td>
                </tr>`;
                tableBody.insertAdjacentHTML('beforeend', tr);
            });
        }
    }
};

app.init();
</script>
</body>
</html>
